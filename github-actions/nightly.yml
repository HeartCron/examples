# .github/workflows/nightly.yml — a scheduled workflow monitored by Heartcron.
# Save the check's ping URL as the repository secret HEARTCRON_URL.
name: Nightly sync
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: heartcron/ping-action@v1
        with:
          url: ${{ secrets.HEARTCRON_URL }}
          status: start
      - uses: actions/checkout@v4
      - run: ./scripts/sync.sh 2>&1 | tee sync.log
      - uses: heartcron/ping-action@v1
        if: always()
        with:
          url: ${{ secrets.HEARTCRON_URL }}
          status: ${{ job.status }}
          body-file: sync.log
